[Unit]
# The flush runs before /var/volatile is mounted and before
# systemd-tmpfiles-setup links /var/log/journal to persistent storage, so
# journald found no /var/log/journal and kept the journal in /run. Mount it
# and create the link first.
Wants=var-volatile.mount
After=var-volatile.mount

[Service]
ExecStartPre=systemd-tmpfiles --create /usr/lib/tmpfiles.d/00-create-volatile.conf /usr/lib/tmpfiles.d/demo-journal.conf
