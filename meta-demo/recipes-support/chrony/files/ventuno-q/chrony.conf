# VENTUNO Q: time source for the offline demo Wi-Fi network (10.42.0.0/24).
# Serve the local clock only: the clients need agreement with this clock,
# not UTC, and an upstream source would add its delay to every client's
# error bound. chrony-boot-sync.service sets the clock from internet NTP
# once at boot when there is an uplink.
local stratum 8
allow 10.42.0.0/24

driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
