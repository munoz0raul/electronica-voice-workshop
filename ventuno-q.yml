# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

  includes:
    - repo: meta-qcom-arduino
      file: ci/ventuno-q.yml
    - repo: meta-qcom
      file: ci/qcom-distro-sota.yml
    - repo: meta-qcom
      file: ci/performance.yml
    - repo: meta-qcom
      file: ci/base.lock.yml
    - repo: meta-qcom
      file: ci/capsule.yml
    - repo: meta-qcom
      file: ci/capsule-test-keys.yml
    - repo: meta-qcom
      file: ci/meta-arm.yml
    - common.yml

target: ventuno-q-demo-image
repos:
  # this repo: local layer with the demo's OS-side pieces
  oss-2026-foundries-demo:
    layers:
      meta-demo:
  # Branch and commit: a lock file in locks/ (build-os.sh --lock)
  meta-qcom-arduino:
    url: https://github.com/qualcomm-linux/meta-qcom-arduino
  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom
  meta-ai:
    # meta-qcom's ci/qcom-distro.yml adds meta-ai (onnxruntime, tflite,
    # llama-cpp); the demo uses none of it.
    layers:
      .: disabled
  # Go 1.27.3 for update-server (its go.mod minimum); wrynose ships 1.26.
  # Its own checkout: meta-qcom's ci/base.yml takes meta-lts-mixins for the
  # wrynose/linux-firmware branch. The layer supports wrynose only, so
  # main.lock.yml (blacksail) fails to parse with it.
  meta-lts-mixins-go:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: wrynose/go
    commit: 21e03d9b3733d1cf0c31e699753be4ad62f4b99e

local_conf_header:
  zephyr-firmware: |
    IMAGE_INSTALL:append:ventuno-q = " zephyr-firmware zephyr-loader kernel-module-pwrseq-pcie-m2"

  update-server: |
    # Foundries update-server as a host service (meta-demo update-server)
    IMAGE_INSTALL:append:ventuno-q = " update-server"

  poll-and-build: |
    # Git-driven OTA: a systemd timer that watches the workshop repo and stages
    # a new Target when an app changes (meta-demo poll-and-build). RDEPENDS pulls
    # the loop's tools (git, fiocli, docker-buildx, python3-pyyaml, composectl).
    IMAGE_INSTALL:append:ventuno-q = " poll-and-build"

  dashboard-data: |
    # /var/local/dashboard for the dashboard's demo-mode state (meta-demo dashboard-data)
    IMAGE_INSTALL:append:ventuno-q = " dashboard-data"

  eth-mac: |
    # Stable Ethernet MAC: the board has no factory one (meta-demo eth-mac)
    IMAGE_INSTALL:append:ventuno-q = " eth-mac"

  demo-health: |
    # The Health remote action (meta-demo demo-health). The VENTUNO Q takes
    # no OS update in the demo, so it always has it; the UNO Qs get it with
    # kas/demo-health.yml (docs/DEMO-SETUP.md).
    IMAGE_INSTALL:append:ventuno-q = " demo-health"

  wifi-uplink: |
    # USB Wi-Fi dongle (RTL8822BU) for an optional internet uplink
    IMAGE_INSTALL:append:ventuno-q = " kernel-module-rtw88-8822bu linux-firmware-rtl8822"

  static-gids: |
    # Fixed GIDs for wayland (weston-init) and render (systemd's udev): the
    # kiosk app adds them by number, and dynamic IDs change between clean
    # builds (meta-demo files/demo-group). Unlisted users and groups stay
    # dynamic: USERADD_ERROR_DYNAMIC is unset.
    USERADDEXTENSION = "useradd-staticids"
    USERADD_GID_TABLES = "files/demo-group"

  capsule-board: |
    # FMP ESRT GUID read from the Ventuno Q board:
    # /sys/firmware/efi/esrt/entries/entry0/fw_class
    CAPSULE_GUID = "8bf4424f-e842-409c-80be-1418e91ef343"
    # qcom-capsule-tool encodes "a.b.c.d" as (c << 16) | d -- a and b are
    # dropped, so bump only the last two fields; 0.0.1.2 = 0x10002 must be
    # above the board's ESRT fw_version.
    CAPSULE_FW_VERSION = "0.0.1.2"
    CAPSULE_FW_LSV = "0.0.1.1"

    # Ventuno Q boots from eMMC (512-byte sectors): the whole A/B boot
    # stack lives in the user-data area GPT (rawprogram0/gpt_main0,
    # physical partition 0); physical partition 1 only carries cdt.
    CAPSULE_FLASH_TYPE = "EMMC"

    # Capsule payload: every *_a boot-stack partition rawprogram0.xml
    # programs, all on EMMC_PARTITION_USER_DATA. Updating the full set
    # together keeps the boot stack consistent -- a partial mix (e.g. new
    # xbl_config on GA xbl) boot-loops. Dest *_a, Backup *_b:
    # qcom-capsule-tool's XmlParser requires a Backup on every FwEntry,
    # and without one fv-create silently emits an empty FV. GUIDs per
    # cbsp-boot-utilities FirmwarePartitions.md (QCS8300 column), verified
    # against the partition type GUIDs in the build's gpt_main0.bin.
    # apdp (zeros placeholder) and partitions with no image in the build
    # (qupfw, gearvm, ddr, keymaster, core_nhlos) are omitted.
    CAPSULE_ENTRIES = "xbl xbl_config shrm aop uefi uefisecapp xbl_ramdump dtb tz hyp devcfg cpucp multiimgoem multiimgqti imagefv"

    CAPSULE_ENTRY_xbl[binary] = "xbl.elf"
    CAPSULE_ENTRY_xbl[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl[dest_partition] = "xbl_a"
    CAPSULE_ENTRY_xbl[dest_guid] = "{DEA0BA2C-CBDD-4805-B4F9-F428251C3E98}"
    CAPSULE_ENTRY_xbl[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl[backup_partition] = "xbl_b"
    CAPSULE_ENTRY_xbl[backup_guid] = "{7A3DF1A3-A31A-454D-BD78-DF259ED486BE}"

    CAPSULE_ENTRY_xbl_config[binary] = "xbl_config.elf"
    CAPSULE_ENTRY_xbl_config[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl_config[dest_partition] = "xbl_config_a"
    CAPSULE_ENTRY_xbl_config[dest_guid] = "{5A325AE4-4276-B66D-0ADD-3494DF27706A}"
    CAPSULE_ENTRY_xbl_config[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl_config[backup_partition] = "xbl_config_b"
    CAPSULE_ENTRY_xbl_config[backup_guid] = "{F462E0EA-A20E-4B10-867A-2D4455366548}"

    CAPSULE_ENTRY_shrm[binary] = "shrm.elf"
    CAPSULE_ENTRY_shrm[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_shrm[dest_partition] = "shrm_a"
    CAPSULE_ENTRY_shrm[dest_guid] = "{CB74CA22-2F0D-4B82-A1D6-C4213F348D73}"
    CAPSULE_ENTRY_shrm[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_shrm[backup_partition] = "shrm_b"
    CAPSULE_ENTRY_shrm[backup_guid] = "{39FD6C00-49EB-6BD1-6899-2FB849DD4F75}"

    CAPSULE_ENTRY_aop[binary] = "aop.mbn"
    CAPSULE_ENTRY_aop[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_aop[dest_partition] = "aop_a"
    CAPSULE_ENTRY_aop[dest_guid] = "{D69E90A5-4CAB-0071-F6DF-AB977F141A7F}"
    CAPSULE_ENTRY_aop[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_aop[backup_partition] = "aop_b"
    CAPSULE_ENTRY_aop[backup_guid] = "{B8B27C4C-4B5B-8AB2-502F-A792B590A896}"

    CAPSULE_ENTRY_uefi[binary] = "uefi.elf"
    CAPSULE_ENTRY_uefi[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_uefi[dest_partition] = "uefi_a"
    CAPSULE_ENTRY_uefi[dest_guid] = "{400FFDCD-22E0-47E7-9A23-F16ED9382388}"
    CAPSULE_ENTRY_uefi[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_uefi[backup_partition] = "uefi_b"
    CAPSULE_ENTRY_uefi[backup_guid] = "{9F234B5B-0EFB-4313-8E4C-0AF1F605536B}"

    CAPSULE_ENTRY_uefisecapp[binary] = "uefi_sec.mbn"
    CAPSULE_ENTRY_uefisecapp[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_uefisecapp[dest_partition] = "uefisecapp_a"
    CAPSULE_ENTRY_uefisecapp[dest_guid] = "{BE8A7E08-1B7A-4CAE-993A-D5B7FB55B3C2}"
    CAPSULE_ENTRY_uefisecapp[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_uefisecapp[backup_partition] = "uefisecapp_b"
    CAPSULE_ENTRY_uefisecapp[backup_guid] = "{538CBDBA-D4A4-4438-A466-D7B356FAC165}"

    CAPSULE_ENTRY_xbl_ramdump[binary] = "XblRamdump.elf"
    CAPSULE_ENTRY_xbl_ramdump[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl_ramdump[dest_partition] = "xbl_ramdump_a"
    CAPSULE_ENTRY_xbl_ramdump[dest_guid] = "{0382F197-E41F-4E84-B18B-0B564AEAD875}"
    CAPSULE_ENTRY_xbl_ramdump[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_xbl_ramdump[backup_partition] = "xbl_ramdump_b"
    CAPSULE_ENTRY_xbl_ramdump[backup_guid] = "{C3E58B09-ABCB-42EA-9F0C-3FA453FA892E}"

    # entry key must be exactly "dtb": qcom-capsule.bbclass only stages
    # dtb.bin (from dtb-${QCOM_DTB_DEFAULT}-image.vfat) and depends on the
    # kernel deploy when it finds that word in CAPSULE_ENTRIES.
    CAPSULE_ENTRY_dtb[binary] = "dtb.bin"
    CAPSULE_ENTRY_dtb[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_dtb[dest_partition] = "dtb_a"
    CAPSULE_ENTRY_dtb[dest_guid] = "{2A1A52FC-AA0B-401C-A808-5EA0F91068F8}"
    CAPSULE_ENTRY_dtb[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_dtb[backup_partition] = "dtb_b"
    CAPSULE_ENTRY_dtb[backup_guid] = "{A166F11A-2B39-4FAA-B7E7-F8AA080D0587}"

    CAPSULE_ENTRY_tz[binary] = "tz.mbn"
    CAPSULE_ENTRY_tz[dest_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_tz[dest_partition] = "tz_a"
    CAPSULE_ENTRY_tz[dest_guid] = "{A053AA7F-40B8-4B1C-BA08-2F68AC71A4F4}"
    CAPSULE_ENTRY_tz[backup_disk] = "EMMC_PARTITION_USER_DATA"
    CAPSULE_ENTRY_tz[backup_partition] = "tz_b"
