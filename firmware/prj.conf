# SPDX-License-Identifier: MIT
CONFIG_GPIO=y
CONFIG_COUNTER=y

# LED matrix service: MCUmgr SMP over the Linux link (zephyr,uart-mcumgr)
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Custom groups don't raise the zcbor nesting defaults (0 = no map decoding)
CONFIG_MCUMGR_SMP_CBOR_MAX_DECODING_LEVELS=2
# Console output kept for the service's LOG command
CONFIG_RING_BUFFER=y
