# Demo Wi-Fi access point, generated from wifi.conf by the demo-wifi recipe.
interface=@IFACE@
driver=nl80211
ssid=@SSID@
country_code=@COUNTRY@
# Advertise the country in beacons so clients (world regulatory domain)
# can use 5 GHz channels actively instead of passive scanning only.
ieee80211d=1
hw_mode=@HWMODE@
channel=@CHANNEL@
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=@PSK@
# Send multicast (the lighting sync) as acknowledged, retried unicast copies
# per client: plain multicast is sent once at a basic rate and occasionally
# lost, which drops a lighting update on that board.
multicast_to_unicast=1
