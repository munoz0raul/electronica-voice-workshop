# SRAM-only STM32U5/H5 debug target; the CPU access port is machine-specific.
# Based on ST/Arduino OpenOCD target scripts; no flash banks or flash loaders.
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

swj_newdap $CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x0be12477
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu
target create $CHIPNAME.ap0 mem_ap -endian little -dap $CHIPNAME.dap -ap-num 0
target create $CHIPNAME.cpu cortex_m -endian little -dap $CHIPNAME.dap -ap-num $CPU_AP
$CHIPNAME.cpu configure -work-area-phys 0x20000000 -work-area-size 0
adapter srst delay 100
cortex_m reset_config sysresetreq

proc zephyr_ram_debug_access {} {
    global CHIPNAME
    # Match AHB access security to the halted Cortex-M33 state (DSCSR.CDS).
    if {[mrw 0xe000ee08] & 0x10000} {
        $CHIPNAME.dap apcsw 0x0b000000 0x4f000000
    } else {
        $CHIPNAME.dap apcsw 0x4b000000 0x4f000000
    }
}
$CHIPNAME.cpu configure -event halted { zephyr_ram_debug_access }
