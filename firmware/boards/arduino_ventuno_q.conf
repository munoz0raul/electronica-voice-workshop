# USB device stack with the console on CDC ACM (see the cdc-acm-console
# snippet); needs firmware/zephyr-patches for STM32H5F5 OTG HS support.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="OSS 2026 demo"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="VENTUNO Q MCU"
CONFIG_UART_LINE_CTRL=y
